name: ASCII Compliance

on:
  pull_request:
  workflow_dispatch:

jobs:
  ascii-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ASCII compliance scan
        run: python3 scripts/check_ascii_compliance.py --summary-only
