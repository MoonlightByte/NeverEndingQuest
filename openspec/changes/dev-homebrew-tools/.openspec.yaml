overview: |
  Build 5 helper scripts to streamline developer workflow for preparing
  and ingesting Homebrew modules into NEQ. These tools wrap the existing
  ingestion infrastructure (already built) with preflight checks,
  structural transformation, orchestration, and verification.

  This is a DEVELOPER-ONLY workflow. End-users continue using Toolkit GUI.

